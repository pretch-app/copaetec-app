name: Frontend Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate TypeDoc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate documentation
        run: npm run docs:check

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: frontend-documentation-${{ github.sha }}
          path: docs/generated
          if-no-files-found: error
