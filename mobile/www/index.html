<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Copa ETec 2026</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 340px; }
      .logo {
        width: 88px; height: 88px; margin: 0 auto 24px;
        border-radius: 22px;
        background: linear-gradient(135deg, #f59e0b, #b45309);
        display: flex; align-items: center; justify-content: center;
        font-size: 44px; font-weight: 800; color: #1c1917;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #a1a1aa; margin: 0 0 24px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #f59e0b; color: #1c1917;
        font-size: 15px; font-weight: 700;
        padding: 12px 28px; border-radius: 999px;
        width: 100%;
      }
      button:active { opacity: .85; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">C</div>
      <h1>Sin conexión</h1>
      <p>No se pudo cargar la Copa ETec 2026. Revisá tu conexión a internet e intentá de nuevo.</p>
      <button onclick="location.replace('https://copaetec.vercel.app/')">Reintentar</button>
    </div>
  </body>
</html>
